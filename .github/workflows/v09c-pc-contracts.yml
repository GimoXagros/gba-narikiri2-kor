name: v0.9c PC contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  candidate-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python tools/audit_repository.py
      - run: python tools/run_v09c_public_tests.py
