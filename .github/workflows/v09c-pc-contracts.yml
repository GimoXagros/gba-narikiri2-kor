name: v0.9c PC contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  candidate-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python tools/audit_repository.py
      - run: python tools/run_v09c_public_tests.py
