name: v0.9c PC contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  candidate-contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python tools/audit_repository.py
      - run: python tools/run_v09c_public_tests.py
