name: Japanese input patch contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  japanese-application:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -p test_japanese_application.py -v
      - run: python -m unittest discover -s tests -p test_title_trade.py -v
      - run: python -O -m unittest discover -s tests -p test_v11_package.py -v
      - run: python -O -m unittest discover -s tests -p test_v11a_package.py -v
      - run: python -O -m unittest discover -s tests -p test_v11a_build.py -v
      - run: python -O -m unittest discover -s tests -p test_v11b_build.py -v
      - run: python -O -m unittest discover -s tests -p test_v11b_package.py -v
      - run: python -O -m unittest discover -s tests -p test_skill_title_margin.py -v
      - run: python -O -m unittest discover -s tests -p test_v11c_build.py -v
      - run: python -O -m unittest discover -s tests -p test_v11c_package.py -v
      - run: python -O -m unittest discover -s tests -p test_audio_fifo_timing.py -v
